version: '3.9'

services:
  db:
    image: postgres:18
    container_name: "${PROJECT_NAME}.db"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/18/data

volumes:
  pgdata: